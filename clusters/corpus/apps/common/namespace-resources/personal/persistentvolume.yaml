apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-volume1-media-personal
  namespace: personal
spec:
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  capacity:
    storage: 100Ti
  nfs:
    path: /volume1/media/
    server: nas.home.arpa
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-volume1-personal-games
  namespace: personal
spec:
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  capacity:
    storage: 100Ti
  nfs:
    path: /volume1/games/
    server: nas.home.arpa
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
