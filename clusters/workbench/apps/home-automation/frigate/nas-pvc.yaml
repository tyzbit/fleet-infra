apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-data-nas
  namespace: home-automation
spec:
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
  storageClassName: nas
  accessModes:
    - ReadWriteMany
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-volume1-frigate
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  capacity:
    storage: 100Ti
  nfs:
    path: /volume1/frigate/
    server: nas.home.arpa
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-volume1-frigate
  namespace: media
spec:
  volumeName: nas-volume1-frigate
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: ""
  resources:
    requests:
      storage: 100Ti
